name: ActiveSG crowd collection

on:
  # Temporarily pause polling: verified Cloudflare HTTP 403 from GitHub runner.
  # Restore the UTC cron entries below only after an authorized data feed works.
  # - cron: '7,22,37,52 23 * * *' # 07:07–07:52 SGT
  # - cron: '7,22,37,52 0-13 * * *' # 08:07–21:52 SGT
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: activesg-collector-and-pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Enforce 30-day limit and automatically disable recurring workflow
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOW=$(TZ=Asia/Singapore date +%Y-%m-%dT%H:%M:%S%:z)
          CUTOFF='2026-11-27T00:00:00+08:00'
          if [[ "$(date -d "$NOW" +%s)" -ge "$(date -d "$CUTOFF" +%s)" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "The approved 30-day collection has ended; disabling future runs."
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/activesg.yml/disable"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'activesg/requirements.txt'
      - name: Install dependencies and Chromium
        if: steps.gate.outputs.active == 'true'
        run: |
          pip install -r activesg/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test parser and analysis utilities
        if: steps.gate.outputs.active == 'true'
        run: |
          cd activesg
          python -m unittest discover -s . -p 'test_pipeline.py'
      - name: Refresh checkout before collecting
        if: steps.gate.outputs.active == 'true'
        run: git pull --ff-only origin main
      - name: Collect publicly available occupancy data
        if: steps.gate.outputs.active == 'true'
        run: python activesg/src/collector.py
      - name: Upload browser diagnostics if collection fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: activesg-browser-diagnostics
          path: activesg/debug/
          if-no-files-found: warn
          retention-days: 3
      - name: Recalculate historical patterns once daily
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          HOUR=$(TZ=Asia/Singapore date +%H)
          MINUTE=$(TZ=Asia/Singapore date +%M)
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && [[ "$HOUR" == "21" ]] && (( 10#$MINUTE >= 50 )); then
            python activesg/src/build_stats.py
          fi
      - name: Commit compact readings to repository
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add activesg/data/
          if ! git diff --cached --quiet; then
            git commit -m "data: record ActiveSG occupancy (SGT)"
            # A concurrent update may have landed while the browser was collecting.
            # Rebase generated outputs with the current run taking precedence;
            # the scheduled collector is serialized by the concurrency group.
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          else
            echo "No new observations."
          fi
      - name: Prepare static dashboard files
        if: always() && steps.gate.outputs.active == 'true'
        run: |
          mkdir -p activesg/site/data
          cp activesg/data/outlets.json activesg/data/live.json activesg/data/patterns.json activesg/site/data/
      - name: Configure GitHub Pages
        if: always() && steps.gate.outputs.active == 'true'
        uses: actions/configure-pages@v5
      - name: Package dashboard
        if: always() && steps.gate.outputs.active == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: activesg/site
      - name: Deploy dashboard
        if: always() && steps.gate.outputs.active == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_PAGES_DEPLOYMENT_TIMEOUT: 600000
